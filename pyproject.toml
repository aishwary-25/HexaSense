[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexasense"
version = "0.1.0"
description = "Private, local document intelligence for Snapdragon PCs"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["app*", "src*"]

[tool.black]
target-version = ["py311"]

[tool.isort]
profile = "black"
